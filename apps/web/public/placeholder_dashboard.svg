<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Header -->
  <g transform="translate(12, 16)">
    <text x="0" y="16" font-size="15" font-weight="700" fill="#0f172a">MoneyCircle</text>
    <g transform="translate(254, 2)">
      <path d="M5 6a5 5 0 0 1 10 0c0 6 2.5 8 2.5 8H2.5S5 12 5 6" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8.5 17a1.5 1.5 0 0 0 3 0" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="15" cy="2" r="2.5" fill="#2563eb" />
    </g>
  </g>

  <!-- Greeting -->
  <g transform="translate(12, 48)">
    <text x="0" y="15" font-size="16" font-weight="700" fill="#0f172a">Good evening, Steve 👋</text>
    <text x="0" y="31" font-size="11" fill="#64748b">Let's keep growing your savings.</text>
  </g>

  <!-- Card 1: Total Contributions -->
  <g transform="translate(12, 92)">
    <rect width="276" height="130" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="12" y="22" font-size="10" fill="#64748b" font-weight="500">Total Contributions</text>
    <text x="12" y="48" font-size="22" font-weight="800" fill="#0f172a">₦350,000</text>
    <text x="12" y="66" font-size="10" fill="#64748b">Across <tspan fill="#2563eb" font-weight="600">2</tspan> active groups</text>
    
    <rect x="228" y="14" width="36" height="36" rx="8" fill="#eff6ff" />
    <path d="M240 28h12m-12 3h9m-10-8h14a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5h-14a1.5 1.5 0 0 1-1.5-1.5v-6a1.5 1.5 0 0 1 1.5-1.5z" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="12" y1="80" x2="264" y2="80" stroke="#f1f5f9" stroke-width="1" />

    <rect x="12" y="89" width="30" height="30" rx="8" fill="#eff6ff" />
    <path d="M24 105a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm6 4a4.5 4.5 0 0 0-9 0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
    <text x="48" y="101" font-size="13" font-weight="700" fill="#0f172a">2</text>
    <text x="48" y="113" font-size="9" fill="#64748b">Groups</text>

    <line x1="138" y1="92" x2="138" y2="118" stroke="#f1f5f9" stroke-width="1" />

    <rect x="150" y="89" width="30" height="30" rx="8" fill="#f0fdf4" />
    <path d="M165 97a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm-1.5 7l1.5 1.5 3-3" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="186" y="101" font-size="13" font-weight="700" fill="#0f172a">7</text>
    <text x="186" y="113" font-size="9" fill="#64748b">Contributions made</text>
  </g>

  <!-- Card 2: Upcoming Contribution -->
  <g transform="translate(12, 230)">
    <rect width="276" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="12" y="20" font-size="11" font-weight="600" fill="#0f172a">Upcoming Contribution</text>
    
    <rect x="12" y="32" width="32" height="32" rx="8" fill="#eff6ff" />
    <rect x="20" y="41" width="16" height="15" rx="2" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M20 46h16M24 39v3M32 39v3" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>

    <text x="52" y="45" font-size="13" font-weight="700" fill="#0f172a">₦50,000</text>
    <text x="52" y="57" font-size="9" fill="#64748b">Tech Professionals Ajo</text>
    <text x="52" y="70" font-size="9" fill="#64748b">Due <tspan fill="#2563eb" font-weight="600">Aug 25</tspan></text>

    <rect x="194" y="38" width="70" height="26" rx="6" fill="#1d4ed8" />
    <text x="229" y="54" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">Pay contribution</text>
  </g>

  <!-- Card 3: My Savings Groups -->
  <g transform="translate(12, 330)">
    <rect width="276" height="105" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="12" y="20" font-size="11" font-weight="600" fill="#0f172a">My Savings Groups</text>
    <text x="264" y="20" font-size="9" font-weight="600" fill="#2563eb" text-anchor="end">View all</text>

    <rect x="12" y="30" width="252" height="63" rx="9" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
    
    <rect x="18" y="37" width="34" height="34" rx="8" fill="#22c55e" fill-opacity="0.1" />
    <path d="M32 50a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm6 4a4.5 4.5 0 0 0-9 0" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>

    <text x="58" y="49" font-size="10" font-weight="700" fill="#0f172a">Tech Professionals Ajo</text>
    <path d="M256 47l3 3-3 3" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="58" y="62" font-size="9" font-weight="600" fill="#0f172a">₦50,000 <tspan font-weight="400" fill="#64748b">/ month</tspan></text>
    <text x="58" y="73" font-size="8" fill="#64748b">5 of 12 contributions</text>

    <rect x="58" y="79" width="160" height="4" rx="2" fill="#f1f5f9" />
    <rect x="58" y="79" width="67" height="4" rx="2" fill="#22c55e" />

    <rect x="228" y="66" width="28" height="16" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="242" y="77" font-size="8" font-weight="700" fill="#16a34a" text-anchor="middle">42%</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 452)">
    <rect width="300" height="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Home -->
    <g transform="translate(36, 8)">
      <path d="M5 11L10 7L15 11V15H5V11Z" fill="#2563eb" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="10" y="26" font-size="8" font-weight="600" fill="#2563eb" text-anchor="middle">Home</text>
    </g>

    <!-- Groups -->
    <g transform="translate(108, 8)">
      <path d="M12 13v-1a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v1" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="8" cy="7" r="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text x="8" y="26" font-size="8" font-weight="500" fill="#64748b" text-anchor="middle">Groups</text>
    </g>

    <!-- Payments -->
    <g transform="translate(180, 8)">
      <rect x="2" y="4" width="14" height="9" rx="1.5" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <line x1="2" y1="7" x2="16" y2="7" stroke="#64748b" stroke-width="1.5"/>
      <text x="9" y="26" font-size="8" font-weight="500" fill="#64748b" text-anchor="middle">Payments</text>
    </g>

    <!-- Profile -->
    <g transform="translate(252, 8)">
      <path d="M12 13v-1a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v1" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="8" cy="7" r="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text x="8" y="26" font-size="8" font-weight="500" fill="#64748b" text-anchor="middle">Profile</text>
    </g>
  </g>
</svg>
