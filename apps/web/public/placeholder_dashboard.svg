<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 840" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header -->
  <g transform="translate(16, 24)">
    <text x="0" y="20" font-size="20" font-weight="700" fill="#0f172a">MoneyCircle</text>
    <!-- Bell Icon -->
    <g transform="translate(348, 4)">
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="18" cy="3" r="3" fill="#2563eb" />
    </g>
  </g>

  <!-- Greeting -->
  <g transform="translate(16, 70)">
    <text x="0" y="20" font-size="22" font-weight="700" fill="#0f172a">Good evening, Steve 👋</text>
    <text x="0" y="42" font-size="14" fill="#64748b">Let's keep growing your savings.</text>
  </g>

  <!-- Card 1: Total Contributions -->
  <g transform="translate(16, 132)">
    <rect width="368" height="180" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="16" y="32" font-size="13" fill="#64748b" font-weight="500">Total Contributions</text>
    <text x="16" y="68" font-size="30" font-weight="800" fill="#0f172a">₦350,000</text>
    <text x="16" y="92" font-size="13" fill="#64748b">Across <tspan fill="#2563eb" font-weight="600">2</tspan> active groups</text>
    
    <!-- Wallet Icon Badge -->
    <rect x="304" y="20" width="48" height="48" rx="12" fill="#eff6ff" />
    <path d="M320 38h16m-16 4h12m-14-10h18a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-18a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2z" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="16" y1="110" x2="352" y2="110" stroke="#f1f5f9" stroke-width="1" />

    <!-- Sub-stat 1 -->
    <rect x="16" y="122" width="40" height="40" rx="10" fill="#eff6ff" />
    <!-- Users Icon -->
    <path d="M32 144a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm8 6a6 6 0 0 0-12 0" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
    <text x="68" y="138" font-size="18" font-weight="700" fill="#0f172a">2</text>
    <text x="68" y="154" font-size="12" fill="#64748b">Groups</text>

    <line x1="184" y1="126" x2="184" y2="162" stroke="#f1f5f9" stroke-width="1" />

    <!-- Sub-stat 2 -->
    <rect x="200" y="122" width="40" height="40" rx="10" fill="#f0fdf4" />
    <!-- Check Circle Icon -->
    <path d="M220 132a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 10l2 2 4-4" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="252" y="138" font-size="18" font-weight="700" fill="#0f172a">7</text>
    <text x="252" y="154" font-size="12" fill="#64748b">Contributions made</text>
  </g>

  <!-- Card 2: Upcoming Contribution -->
  <g transform="translate(16, 328)">
    <rect width="368" height="126" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="16" y="28" font-size="14" font-weight="600" fill="#0f172a">Upcoming Contribution</text>
    
    <rect x="16" y="44" width="44" height="44" rx="10" fill="#eff6ff" />
    <!-- Calendar Icon -->
    <rect x="28" y="56" width="20" height="20" rx="3" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M28 62h20M33 53v4M43 53v4" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>

    <text x="72" y="62" font-size="18" font-weight="700" fill="#0f172a">₦50,000</text>
    <text x="72" y="78" font-size="12" fill="#64748b">Tech Professionals Ajo</text>
    <text x="72" y="96" font-size="12" fill="#64748b">Due <tspan fill="#2563eb" font-weight="600">Aug 25</tspan></text>

    <!-- Pay Button -->
    <rect x="264" y="52" width="92" height="36" rx="8" fill="#1d4ed8" />
    <text x="310" y="74" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Pay contribution</text>
  </g>

  <!-- Card 3: My Savings Groups -->
  <g transform="translate(16, 470)">
    <rect width="368" height="144" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="16" y="28" font-size="14" font-weight="600" fill="#0f172a">My Savings Groups</text>
    <text x="352" y="28" font-size="12" font-weight="600" fill="#2563eb" text-anchor="end">View all</text>

    <!-- Group Item Box -->
    <rect x="16" y="42" width="336" height="86" rx="12" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
    
    <rect x="24" y="51" width="48" height="48" rx="12" fill="#dc2626" fill-opacity="0.1" />
    <rect x="24" y="51" width="48" height="48" rx="12" fill="#22c55e" fill-opacity="0.1" />
    <!-- Users Group Icon -->
    <path d="M44 70a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm8 6a6 6 0 0 0-12 0" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>

    <text x="82" y="68" font-size="14" font-weight="700" fill="#0f172a">Tech Professionals Ajo</text>
    <path d="M340 65l4 4-4 4" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="82" y="86" font-size="12" font-weight="600" fill="#0f172a">₦50,000 <tspan font-weight="400" fill="#64748b">/ month</tspan></text>
    <text x="82" y="102" font-size="11" fill="#64748b">5 of 12 contributions</text>

    <!-- Progress Bar -->
    <rect x="82" y="110" width="220" height="6" rx="3" fill="#f1f5f9" />
    <rect x="82" y="110" width="92" height="6" rx="3" fill="#22c55e" />

    <!-- Badge -->
    <rect x="312" y="93" width="34" height="22" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="329" y="108" font-size="10" font-weight="700" fill="#16a34a" text-anchor="middle">42%</text>
  </g>

  <!-- Card 4: Recent Activity -->
  <g transform="translate(16, 630)">
    <rect width="368" height="142" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="16" y="26" font-size="14" font-weight="600" fill="#0f172a">Recent Activity</text>
    <text x="352" y="26" font-size="12" font-weight="600" fill="#2563eb" text-anchor="end">View all</text>

    <!-- Row 1 -->
    <g transform="translate(16, 38)">
      <circle cx="10" cy="10" r="9" fill="#22c55e" />
      <path d="M7 10l2 2 4-4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="14" font-size="12" font-weight="700" fill="#0f172a">₦50,000</text>
      <text x="88" y="14" font-size="11" fill="#64748b">Contribution to Tech Professionals Ajo</text>
      <text x="336" y="14" font-size="10" fill="#64748b" text-anchor="end">Aug 18, 2024</text>
      <line x1="0" y1="24" x2="336" y2="24" stroke="#f8fafc" stroke-width="1" />
    </g>

    <!-- Row 2 -->
    <g transform="translate(16, 68)">
      <circle cx="10" cy="10" r="9" fill="#22c55e" />
      <path d="M7 10l2 2 4-4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="14" font-size="12" font-weight="700" fill="#0f172a">₦50,000</text>
      <text x="88" y="14" font-size="11" fill="#64748b">Contribution to House Rent Ajo</text>
      <text x="336" y="14" font-size="10" fill="#64748b" text-anchor="end">Aug 11, 2024</text>
      <line x1="0" y1="24" x2="336" y2="24" stroke="#f8fafc" stroke-width="1" />
    </g>

    <!-- Row 3 -->
    <g transform="translate(16, 98)">
      <circle cx="10" cy="10" r="8.5" fill="#fef3c7" stroke="#d97706" stroke-width="1" />
      <text x="10" y="14" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle">!</text>
      <text x="30" y="14" font-size="12" font-weight="700" fill="#0f172a">₦50,000</text>
      <text x="88" y="14" font-size="11" fill="#64748b">Pending contribution to Emergency Fund</text>
      <text x="336" y="14" font-size="10" font-weight="600" fill="#d97706" text-anchor="end">Aug 4, 2024</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 780)">
    <rect width="400" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Home (Active) -->
    <g transform="translate(48, 10)">
      <path d="M6 15L12 10L18 15V21H6V15Z" fill="#2563eb" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>
      <text x="12" y="34" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">Home</text>
    </g>

    <!-- Groups -->
    <g transform="translate(144, 10)">
      <path d="M16 17v-1a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3v1" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <circle cx="11" cy="9" r="3" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="11" y="34" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Groups</text>
    </g>

    <!-- Payments -->
    <g transform="translate(240, 10)">
      <rect x="2" y="6" width="18" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="2"/>
      <line x1="2" y1="10" x2="20" y2="10" stroke="#64748b" stroke-width="2"/>
      <text x="11" y="34" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Payments</text>
    </g>

    <!-- Profile -->
    <g transform="translate(336, 10)">
      <path d="M16 17v-1a3 3 0 0 0-3-3h-2a3 3 0 0 0-3 3v1" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <circle cx="11" cy="9" r="3" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="11" y="34" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Profile</text>
    </g>
  </g>
</svg>
